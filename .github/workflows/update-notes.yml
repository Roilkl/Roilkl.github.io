name: Update Notes List

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0:00运行
  workflow_dispatch:      # 允许手动触发
  push:
    paths:
      - '.github/workflows/update-notes.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install PyGithub
        
    - name: Generate notes list
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python << 'EOF'
from github import Github
import yaml
import os

g = Github(os.environ['GITHUB_TOKEN'])
repo = g.get_repo("Roilkl/note")
contents = repo.get_contents("")

notes = []
for file in contents:
    if file.name.endswith('.pdf'):
        notes.append({
            'title': file.name.replace('.pdf', '').replace('_', ' '),
            'filename': file.name,
            'url': f"https://raw.githubusercontent.com/Roilkl/note/main/{file.name}",
            'github_url': f"https://github.com/Roilkl/note/blob/main/{file.name}",
            'size_kb': round(file.size / 1024, 1)
        })

notes.sort(key=lambda x: x['filename'])

os.makedirs('_data', exist_ok=True)
with open('_data/notes.yml', 'w') as f:
    yaml.dump(notes, f, default_flow_style=False)
    
print(f"Found {len(notes)} PDF files")
EOF
        
    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add _data/notes.yml
        git diff --quiet && git diff --staged --quiet || git commit -m "Update notes list [skip ci]"
        git push
